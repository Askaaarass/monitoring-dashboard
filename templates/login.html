<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Мониторинг Аквапоники</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-800 dark:text-white">Вход в систему</h2>
        
        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div class="mb-4 p-3 bg-red-100 dark:bg-red-900/30 border border-red-400 text-red-700 dark:text-red-300 rounded-lg text-sm">
                Неверный логин или пароль.
            </div>
            {% endif %}

            <div class="mb-4">
                <label class="block text-slate-600 dark:text-slate-300 mb-2">Логин</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-700 dark:text-white dark:border-slate-600">
            </div>
            <div class="mb-6">
                <label class="block text-slate-600 dark:text-slate-300 mb-2">Пароль</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-700 dark:text-white dark:border-slate-600">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition duration-200">Войти</button>

            <!-- Ссылка на регистрацию -->
            <div class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
                Нет аккаунта? 
                <a href="{% url 'register' %}" class="text-blue-600 hover:underline dark:text-blue-400 font-semibold">Зарегистрироваться</a>
            </div>
        </form>
        <a href="{% url 'dashboard' %}" class="mt-4 block text-center text-sm font-semibold text-blue-600 hover:underline dark:text-blue-400">
            Продолжить как гость — только просмотр
        </a>
    </div>
</body>
</html>
